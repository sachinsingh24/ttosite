<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/android-chrome-192x192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#be0d07" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTO – IIT Hyderabad</title>

    <link rel="preload" as="image" href="/tto-logo.png" fetchpriority="high" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Initial loader before React mounts -->
    <div id="initial-loader">
      <div class="tto-loader-container">
        <div class="orbit"></div>

        <div class="tto-loader-image">
          <img src="/tto-logo.png" alt="TTO IIT Hyderabad Logo" fetchpriority="high" decoding="async" />
        </div>

        <div class="tto-brand">
          <strong>Web page is loading...</strong>
          <span>Please wait a moment</span>
        </div>
      </div>
    </div>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #151515 0%, #070707 75%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .tto-loader-container {
        position: relative;
        text-align: center;
      }

      /* Orbit ring (global transfer feel) */
      .orbit {
        position: absolute;
        inset: -25px;
        border-radius: 50%;
        border: 1px solid rgba(255, 180, 80, 0.25);
        animation: orbit 6s linear infinite;
      }

      .orbit::after {
        content: "";
        position: absolute;
        top: -4px;
        left: 50%;
        width: 8px;
        height: 8px;
        background: #f08815;
        border-radius: 50%;
        box-shadow: 0 0 12px #f08815;
        transform: translateX(-50%);
      }

      .tto-loader-image {
        width: 80px;
        height: 80px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 16px rgba(240, 136, 21, 0.4));
        animation: pulse 2s ease-in-out infinite;
      }

      .tto-loader-image img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      /* Soft breathing animation */
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }

      /* Branding text */
      .tto-brand {
        margin-top: 10px;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #f3b04d;
        opacity: 0.9;
      }

      .tto-brand span {
        display: block;
        font-size: 11px;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1.5px;
      }

      /* Animations */
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(1.15);
        }
      }

      @keyframes slide {
        0%,
        100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(6px);
        }
      }
    </style>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
